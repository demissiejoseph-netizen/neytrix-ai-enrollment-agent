name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore NeytrixAI.sln

      - name: Build
        run: dotnet build NeytrixAI.sln -c Release --no-restore

      # Docker is available on ubuntu-latest, so the Testcontainers-backed
      # tenant-isolation tests run here for real instead of self-skipping.
      - name: Test
        run: dotnet test NeytrixAI.sln -c Release --no-build --verbosity normal

  widget:
    name: Widget (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: widget
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t neytrix/enrollment-agent:ci .
